[project]
name = "hours-agent"
version = "0.1.0"
description = "Project-hours sample agent: A2UI 1.0 over A2A."
requires-python = ">=3.12"
dependencies = [
  # a2ui-a2a 0.3.0 requires the 0.3 line of the A2A SDK.
  "a2a-sdk[http-server]>=0.3.26,<0.4",
  "a2ui-a2a>=0.3.0",
  "a2ui-agent-sdk>=0.11.0",
  "deepagents>=0.7.37",
  "langchain-openai>=1.7.4",
  "uvicorn>=0.30",
]

[project.scripts]
hours-agent = "hours_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hours_agent"]
